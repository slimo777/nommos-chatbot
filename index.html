<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NOMMOS — Assistant</title>
<style>
  :root{
    --bg:#0e0d0b; --panel:#17151230; --line:#2a2621;
    --ink:#f0ebe4; --mute:#9a9084; --gold:#c9a227; --bubble:#1d1a16;
  }
  *{box-sizing:border-box}
  body{
    margin:0; min-height:100vh; background:var(--bg); color:var(--ink);
    font:16px/1.55 -apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    display:flex; align-items:center; justify-content:center; padding:16px;
  }
  .app{
    width:100%; max-width:440px; height:min(680px,92vh);
    background:linear-gradient(180deg,#141210,#0e0d0b);
    border:1px solid var(--line); border-radius:14px;
    display:flex; flex-direction:column; overflow:hidden;
  }
  header{padding:18px 20px; border-bottom:1px solid var(--line)}
  .name{font-size:15px; letter-spacing:.22em; color:var(--gold)}
  .sub{font-size:12px; color:var(--mute); margin-top:3px}
  #log{flex:1; overflow-y:auto; padding:18px 16px; display:flex; flex-direction:column; gap:12px}
  .msg{max-width:84%; padding:11px 14px; border-radius:13px; font-size:15px; white-space:pre-wrap}
  .bot{background:var(--bubble); border:1px solid var(--line); border-bottom-left-radius:4px; align-self:flex-start}
  .me{background:var(--gold); color:#17140d; border-bottom-right-radius:4px; align-self:flex-end}
  .chips{display:flex; flex-wrap:wrap; gap:7px; padding:0 16px 12px}
  .chip{
    background:transparent; color:var(--mute); border:1px solid var(--line);
    border-radius:999px; padding:7px 12px; font-size:13px; cursor:pointer; font-family:inherit;
  }
  .chip:hover{color:var(--gold); border-color:var(--gold)}
  form{display:flex; gap:8px; padding:12px 14px; border-top:1px solid var(--line)}
  input{
    flex:1; background:#100e0c; border:1px solid var(--line); color:var(--ink);
    padding:11px 13px; border-radius:9px; font:inherit; outline:none;
  }
  input:focus{border-color:var(--gold)}
  button[type=submit]{
    background:var(--gold); color:#17140d; border:0; border-radius:9px;
    padding:0 18px; font:inherit; font-weight:600; cursor:pointer;
  }
  button[disabled]{opacity:.5; cursor:default}
  .dots{color:var(--mute); font-style:italic; font-size:14px}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="name">N O M M O S</div>
    <div class="sub">Tangier Bay · ask me anything about the menu</div>
  </header>

  <div id="log">
    <div class="msg bot" dir="auto">Bonsoir, and welcome to NOMMOS. Ask me about our menu, prices or opening hours — in English, French or Arabic.</div>
  </div>

  <div class="chips" id="chips">
    <button class="chip">What time do you close?</button>
    <button class="chip">Avez-vous des plats végétariens ?</button>
    <button class="chip">How much is the Nommos?</button>
    <button class="chip">ما هي ساعات العمل؟</button>
  </div>

  <form id="form">
    <input id="input" placeholder="Type your question…" autocomplete="off" dir="auto">
    <button type="submit" id="send">Send</button>
  </form>
</div>

<script>
const log = document.getElementById('log');
const form = document.getElementById('form');
const input = document.getElementById('input');
const send = document.getElementById('send');
const chips = document.getElementById('chips');

const history = [];

function add(text, who){
  const el = document.createElement('div');
  el.className = 'msg ' + who;
  el.setAttribute('dir','auto');
  el.textContent = text;
  log.appendChild(el);
  log.scrollTop = log.scrollHeight;
  return el;
}

async function ask(question){
  if(!question.trim()) return;
  chips.style.display = 'none';
  add(question, 'me');
  input.value = '';
  send.disabled = true;

  const thinking = add('…', 'bot');
  thinking.classList.add('dots');

  try{
    const res = await fetch('/chat', {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({message: question, history: history.slice(-6)})
    });
    const data = await res.json();
    thinking.classList.remove('dots');
    thinking.textContent = data.reply;
    history.push({role:'user', text:question});
    history.push({role:'assistant', text:data.reply});
  }catch(err){
    thinking.classList.remove('dots');
    thinking.textContent = "Sorry — I couldn't reach the kitchen. Is the server running?";
  }
  send.disabled = false;
  input.focus();
  log.scrollTop = log.scrollHeight;
}

form.addEventListener('submit', e => { e.preventDefault(); ask(input.value); });
chips.addEventListener('click', e => {
  if(e.target.classList.contains('chip')) ask(e.target.textContent);
});
</script>
</body>
</html>
